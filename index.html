<script>
const $ = id => document.getElementById(id);
const esc = s => (s||"").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function showErr(msg){
  try{
    const b=document.getElementById("errBanner");
    const t=document.getElementById("errText");
    if(b&&t){t.textContent=String(msg||"неизвестная ошибка");b.classList.add("show");}
    console.error("[kyiv-map error]",msg);
  }catch(e){}
}
window.addEventListener("error",(ev)=>{ showErr((ev&&ev.message)||"ошибка скрипта"); });
window.addEventListener("unhandledrejection",(ev)=>{ try{showErr((ev.reason&&ev.reason.message)||String(ev.reason));}catch(e){} });

}

function haversineKm(lat1,lon1,lat2,lon2){
  const R=6371,toRad=d=>d*Math.PI/180;
  const dLat=toRad(lat2-lat1),dLon=toRad(lon2-lon1);
  const a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}
function bearingBetween(lat1,lon1,lat2,lon2){
  const φ1=lat1*Math.PI/180,φ2=lat2*Math.PI/180;
  const Δλ=(lon2-lon1)*Math.PI/180;
  const y=Math.sin(Δλ)*Math.cos(φ2);
  const x=Math.cos(φ1)*Math.sin(φ2)-Math.sin(φ1)*Math.cos(φ2)*Math.cos(Δλ);
  return( Math.atan2(y,x)*180/Math.PI+360)%360;
}
function destPoint(lat,lon,bearingDeg,distKm){
  const R=6371,br=bearingDeg*Math.PI/180;
  const lat1=lat*Math.PI/180,lon1=lon*Math.PI/180;
  const lat2=Math.asin(Math.sin(lat1)*Math.cos(distKm/R)+Math.cos(lat1)*Math.sin(distKm/R)*Math.cos(br));
  const lon2=lon1+Math.atan2(Math.sin(br)*Math.sin(distKm/R)*Math.cos(lat1),Math.cos(distKm/R)-Math.sin(lat1)*Math.sin(lat2));
  return[lat2*180/Math.PI,lon2*180/Math.PI];
}

}

/* v14.28.0: парсер координат из сообщения */
function parseCoordsFromText(text){
  if(!text)return null;
  const m=text.match(/(-?\d{2}\.\d{3,8})\s*[,\s]\s*(-?\d{2,3}\.\d{3,8})/);
  if(!m)return null;
  const lat=parseFloat(m[1]),lon=parseFloat(m[2]);
  if(!Number.isFinite(lat)||!Number.isFinite(lon))return null;
  if(lat<-90||lat>90||lon<-180||lon>180)return null;
  return[lat,lon];
}

/* v14.28.0: найти точку по тексту (PLACES + EXTRA_PLACES) */
function findImpactPlace(text){
  if(!text)return null;
  const low=text.toLowerCase().replace(/[’`´]/g,"'");
  /* Сначала точные из EXTRA_PLACES */
  for(const key of Object.keys(EXTRA_PLACES)){
    const re=new RegExp(key,"i");
    if(re.test(low)){
      const arr=EXTRA_PLACES[key];
      return {key:"extra:"+key,name:arr[2],lat:arr[0],lon:arr[1]};
    }
  }
  /* Потом обычные PLACES */
  const p=findPlaceInText(text);
  if(p)return p;
  return null;
}

/* v14.28.0: определить тип сообщения о прилёте */
function detectImpactReports(text){
  if(!text)return[];
  const found=[];
  for(const r of IMPACT_REPORTS_DB){
    if(r.re.test(text))found.push(r);
  }
  /* Приоритет: hit > down > shot > fire > clear */
  const order={hit:5,down:4,shot:3,fire:2,clear:1};
  found.sort((a,b)=>(order[b.kind]||0)-(order[a.kind]||0));
  return found;
}

const activeWarnings = new Map();
function renderWarningsPanel(){
  const panel=$("warningsPanel"),list=$("warningsList"),cnt=$("warningsCount");
  if(!panel||!list||!cnt)return;
  const items=[...activeWarnings.values()].filter(w=>!w.dismissed);
  cnt.textContent=String(items.length);
  if(items.length===0){panel.classList.remove("show");list.innerHTML="";return;}
  panel.classList.add("show");
  list.innerHTML=items.map(w=>{
    const ww=w.warning;
    const t=new Date(w.lastSeen).toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});
    return `<div class="w-item">
      <div class="w-item-body">
        <div class="w-item-label">${esc(ww.label)}</div>
        <div class="w-item-detail">${esc(ww.detail)}</div>
        <div class="w-item-meta">Обновлено: ${t} · Источников: ${w.channels.size}</div>
      </div>
      <button class="w-item-close" data-warn-id="${esc(ww.id)}">✕</button>
    </div>`;
  }).join("");
  list.querySelectorAll(".w-item-close").forEach(b=>{
    b.addEventListener("click",(e)=>{
      e.preventDefault();e.stopPropagation();
      dismissWarning(b.getAttribute("data-warn-id"));
    });
  });
}
function dismissWarning(id){
  const w=activeWarnings.get(id);if(!w)return;
  w.dismissed=true;
  if(w.marker&&msgThreatLayer)try{msgThreatLayer.removeLayer(w.marker);}catch(e){}
  renderWarningsPanel();
  showToast("⚠️ Убрано: "+w.warning.label);
}
function upsertWarning(ww,ch,msgMs){
  let w=activeWarnings.get(ww.id);
  if(!w){
    w={warning:ww,firstSeen:msgMs,lastSeen:msgMs,channels:new Set(),marker:null,dismissed:false};
    activeWarnings.set(ww.id,w);
    playAlertSound(true);
    addWarningMarker(w);
  }
  w.channels.add(ch);
  if(msgMs<w.firstSeen)w.firstSeen=msgMs;
  if(msgMs>w.lastSeen)w.lastSeen=msgMs;
  if(w.marker&&!w.dismissed)try{w.marker.setPopupContent(buildWarningPopup(w));}catch(e){}
}

let audioCtx=null,lastSoundAt=0,keepAliveInterval=null;
function initAudio(){
  if(audioCtx)return audioCtx;
  try{
    const Ctx=window.AudioContext||window.webkitAudioContext;
    if(!Ctx)return null;
    audioCtx=new Ctx();
    startKeepAlive();
  }catch(e){audioCtx=null;}
  return audioCtx;
}
function startKeepAlive(){
  if(keepAliveInterval)return;
  keepAliveInterval=setInterval(()=>{
    if(!audioCtx)return;
    try{
      if(audioCtx.state==="suspended"){audioCtx.resume().catch(()=>{});return;}
      const o=audioCtx.createOscillator();const g=audioCtx.createGain();
      o.type="sine";o.frequency.setValueAtTime(1,audioCtx.currentTime);
      g.gain.setValueAtTime(0.00001,audioCtx.currentTime);
      o.connect(g);g.connect(audioCtx.destination);
      o.start();o.stop(audioCtx.currentTime+0.05);
    }catch(e){}
  },20000);
}
function unlockAudio(){const ctx=initAudio();if(ctx&&ctx.state==="suspended")ctx.resume().catch(()=>{});}
function playBell(){
  if(!audioCtx)return;
  const now=audioCtx.currentTime;
  const partials=[{freq:880,gain:.30,decay:1.1},{freq:1760,gain:.14,decay:.7},{freq:2640,gain:.07,decay:.45}];
  for(const p of partials){
    const o=audioCtx.createOscillator();const g=audioCtx.createGain();
    o.type="sine";o.frequency.setValueAtTime(p.freq,now);
    g.gain.setValueAtTime(.0001,now);
    g.gain.exponentialRampToValueAtTime(p.gain,now+.012);
    g.gain.exponentialRampToValueAtTime(.0001,now+p.decay);
    o.connect(g);g.connect(audioCtx.destination);
    o.start(now);o.stop(now+p.decay+.05);
  }
}
function playAlertSound(force){
  if(!CONFIG.SOUND_ENABLED)return;
  const now=Date.now();
  if(!force&&now-lastSoundAt<CONFIG.SOUND_COOLDOWN_MS)return;
  lastSoundAt=now;
  const ctx=initAudio();if(!ctx)return;
  try{if(ctx.state==="suspended")ctx.resume();playBell();}catch(e){}
}
const firedSoundKeys=new Map();
function isRocketType(type){return CONFIG.ROCKET_TYPES.has(type);}
function fireSirenForTarget(key,clsLike){
  if(!clsLike)return false;
  if(!CONFIG.SOUND_TYPE_FILTER.has(clsLike.type)&&!clsLike.isGeran5)return false;
  const now=Date.now();

  const win=isRocketType(clsLike.type)?CONFIG.SOUND_NEAR_WINDOW_MS_ROCKET:CONFIG.SOUND_NEAR_WINDOW_MS;

  playAlertSound(true);return true;
}

function findKyivAreaInText(text){

  if(m){const v=parseFloat(m[1].replace(",","."));const unit=m[2].toLowerCase();const meters=(unit==="км"||unit==="km")?v*1000:v;if(meters>=50&&meters<=20000)return Math.round(meters);}
  m=text.match(/(\d{3,5})\s*(?:м|m\b)/i);

function processImpactReport(text,ch,msgMs){
  if(!text)return;
  const reports=detectImpactReports(text);
  if(reports.length===0)return;
  const report=reports[0]; /* приоритетный */

  /* 1. Приоритет — координаты прямо из текста */
  let place=null;
  const coords=parseCoordsFromText(text);
  if(coords){
    place={key:"coords:"+coords[0].toFixed(4)+","+coords[1].toFixed(4),name:"Точка "+coords[0].toFixed(3)+","+coords[1].toFixed(3),lat:coords[0],lon:coords[1]};
  } else {
    place=findImpactPlace(text);
  }
  if(!place)return;
  /* Только в зоне 250 км от Киева */
  if(!inZone(place.lat,place.lon))return;
  /* Для "чисто" — отдельная логика: не создаём маркер, а показываем тост */
  if(report.kind==="clear"){
    showToast("🟢 "+text.slice(0,80),2500);
    return;
  }
  addImpactReportMarker(report,place,ch,msgMs);
}

function parseAircraftCount(text){
  if(!text)return null;
  let m=text.match(/(\d+)\s*(?:борт|борти|літак|самолет|ед\.|шт\.)/i);if(m)return parseInt(m[1],10);
  m=text.match(/(\d+)\s*[хx×]\s*(?:ту-?\s*95|ту-?\s*160)/i);if(m)return parseInt(m[1],10);
  return null;
}
function extractLaunchStage(text){
  if(!text)return[];
  const cls=CLASSIFIER(text);
  if(!cls||!cls.hard)return[];
  if(NO_LAUNCH_RE.test(text)&&!/пуск\s+вже|пуск\s+підтверджен|пуски\s+підтверджен|ракети\s+в\s+повітрі/i.test(text))return[];
  const hasLaunch=LAUNCH_RE.test(text);
  const hasThreat=THREAT_RE.test(text);
  let stage=null;
  if(hasLaunch)stage="launch";
  else if(hasThreat)stage="threat";
  else{
    if(cls.type==="uav"||cls.type==="geran5"||cls.type==="jet_drone"||cls.type==="recon"||cls.type==="missile")stage="threat";
    else return[];
  }
  const target=getTargetPlace(text);
  const results=[];
  const origins=findLaunchOriginsInText(text);
  for(const o of origins)results.push({kind:"origin",key:o.key,name:o.name,region:o.region,lat:o.lat,lon:o.lon,cls,stage,target});
  const region=findRegionInText(text);
  if(region&&origins.length===0)results.push({kind:"region",key:region.key,name:region.name,region:region.name,lat:region.lat,lon:region.lon,cls,stage,target});
  return results;
}
function findLaunchOriginsInText(text){
  const t=text||"";const found=[];
  for(const o of LAUNCH_ORIGINS){
    const re=new RegExp(o.re.source,o.re.flags.includes("g")?o.re.flags:o.re.flags+"g");
    let m;
    while((m=re.exec(t))!==null){found.push({...o,index:m.index,length:m[0].length});if(!re.global)break;}
  }
  const seen=new Set();
  return found.filter(o=>{if(seen.has(o.key))return false;seen.add(o.key);return true;}).sort((a,b)=>a.index-b.index);
}

============================================================ */
const msgMarkers=new Map();
const lastPlaceByChannel={};
function syncMessageThreats(messages){
  const now=Date.now();
  for(let i=0;i<(messages||[]).length;i++){
    const m=messages[i];
    const text=m.text||"";
    const ch=(m.channel||"unknown").replace(/^@/,"").toLowerCase();
    const msgMs=m.date?Date.parse(m.date):now;

    /* 1) Warning об угрозе */
    const warns=detectThreatWarnings(text);
    for(const w of warns) upsertWarning(w,ch,msgMs);

    /* 2) Прилёты/падения/сбития */
    processImpactReport(text,ch,msgMs);

    /* 3) Обычные треки (упрощённо) */
    const launches=extractLaunchStage(text);
    if(launches.length>0){
      for(const L of launches){
        if(L.lat==null||L.lon==null)continue;
        if(!inZone(L.lat,L.lon))continue;
        const key=`reg|${L.key}|${L.cls.type}`;
        const marker=L.marker([L.lat,L.lon],{
          icon:L.divIcon({className:"",html:`<div class="threat-marker-icon">✈️</div>`,iconSize:[34,34],iconAnchor:[17,17],popupAnchor:[0,-17]}),
          zIndexOffset:900
        });
        marker.bindPopup(`<div class="popup-title">${esc(L.cls.label)}</div><div>${esc(text.slice(0,200))}</div>`);
        marker.addTo(msgThreatLayer);
        if(msgMarkers.has(key)){const _old=msgMarkers.get(key);if(_old.marker)try{msgThreatLayer.removeLayer(_old.marker);}catch(e){}}
        msgMarkers.set(key,{marker,lastSeen:msgMs,cls:L.cls,place:{name:L.name,lat:L.lat,lon:L.lon}});
      }
    }
  }
  /* Очистка impact-маркеров по TTL */
  const cutoff=now-CONFIG.IMPACT_REPORT_TTL_MS;
  for(const[key,r]of[...impactReports]){
    if(r.lastSeen<cutoff){
      if(r.marker&&impactLayer)try{impactLayer.removeLayer(r.marker);}catch(e){}
      impactReports.delete(key);
    }
  }
  /* Очистка обычных msg-маркеров */
  for(const[key,o]of[...msgMarkers]){
    if(now-o.lastSeen>CONFIG.STALE_MSG_MS){
      if(o.marker&&msgThreatLayer)try{msgThreatLayer.removeLayer(o.marker);}catch(e){}
      msgMarkers.delete(key);
    }
  }
  /* Cleanup warning по grace */
  const warnCutoff=now-CONFIG.WARNING_GRACE_MS;
  for(const[id,w]of[...activeWarnings]){
    if(w.dismissed)continue;
    if(w.lastSeen<warnCutoff){
      if(w.marker&&msgThreatLayer)try{msgThreatLayer.removeLayer(w.marker);}catch(e){}
      activeWarnings.delete(id);
    }
  }
  renderWarningsPanel();
}

let ws=null,wsConnected=false,wsReconnectMs=CONFIG.WS_RECONNECT_MS,wsReconnectTimer=null;
let restFallbackActive=false,pollTimer=null,abortCtrl=null;
let lastAlerts=null;
function wsScheduleReconnect(){
  if(wsReconnectTimer)return;
  wsReconnectTimer=setTimeout(()=>{wsReconnectTimer=null;wsConnect();},wsReconnectMs);
  wsReconnectMs=Math.min(wsReconnectMs*2,CONFIG.WS_RECONNECT_MAX_MS);
}
function wsConnect(){
  try{
    if(ws){try{ws.close();}catch(e){}ws=null;}
    ws=new WebSocket(CONFIG.WS_URL);
    ws.onopen=()=>{wsConnected=true;wsReconnectMs=CONFIG.WS_RECONNECT_MS;restFallbackActive=false;stopRestPolling();updateLiveBadge("ok");};
    ws.onmessage=(e)=>{try{wsHandleFrame(JSON.parse(e.data));}catch(err){}};
    ws.onerror=()=>{};
    ws.onclose=()=>{
      wsConnected=false;ws=null;updateLiveBadge("err");
      if(!restFallbackActive){restFallbackActive=true;startRestPolling();}
      wsScheduleReconnect();
    };
  }catch(e){if(!restFallbackActive){restFallbackActive=true;startRestPolling();}wsScheduleReconnect();}
}
function wsHandleFrame(env){if(!env||!env.type)return;if(env.type==="alerts"){lastAlerts=env.data;}}
function updateLiveBadge(state){
  const badge=$("liveBadge");if(!badge)return;
  if(state==="ok"){badge.textContent=wsConnected?"онлайн · WS":"онлайн";badge.className="live-badge live"+(wsConnected?" ws":"");}
  else if(state==="err"){badge.textContent="ошибка";badge.className="live-badge stale";}
}
async function fetchMessages(){
  try{
    const r=await fetch(CONFIG.API_MESSAGES);
    if(!r.ok)throw new Error("messages "+r.status);
    const data=await r.json();
    try{syncMessageThreats(data.messages||[]);}catch(e){}
    updateLiveBadge("ok");
  }catch(e){updateLiveBadge("err");}
}
function startRestPolling(){if(pollTimer)clearTimeout(pollTimer);pollTimer=setTimeout(fetchMessages,CONFIG.POLL_MS);}
function stopRestPolling(){if(pollTimer){clearTimeout(pollTimer);pollTimer=null;}}

(function initRingsToggle(){
  const btn=$("btnRingsToggle");if(!btn||!map)return;
  try{const v=localStorage.getItem(RINGS_KEY);if(v==="0")ringsVisible=false;else if(v==="1")ringsVisible=true;}catch(e){}
  function apply(){
    if(ringsVisible){
      if(!map.hasLayer(ringsLayer))ringsLayer.addTo(map);
      btn.classList.add("on");btn.classList.remove("off");
    }else{
      if(map.hasLayer(ringsLayer))map.removeLayer(ringsLayer);
      btn.classList.add("off");btn.classList.remove("on");
    }
  }
  apply();
  btn.addEventListener("click",(e)=>{
    e.preventDefault();e.stopPropagation();
    ringsVisible=!ringsVisible;
    try{localStorage.setItem(RINGS_KEY,ringsVisible?"1":"0");}catch(e2){}
    apply();showToast(ringsVisible?"🎯 Круги ВКЛ":"🎯 Круги ВЫКЛ");unlockAudio();
  });
})();
(function initBasemapToggle(){
  const btn=$("btnMapToggle");if(!btn||!map)return;
  btn.addEventListener("click",(e)=>{
    e.preventDefault();e.stopPropagation();
    unlockAudio();
    if(currentBase==="osm"){
      if(osmLayer)map.removeLayer(osmLayer);
      baseSat.addTo(map);currentBase="sat";
      btn.classList.add("on");showToast("🛰 Спутник");
    }else{
      map.removeLayer(baseSat);
      osmLayer=L.tileLayer(CONFIG.TILE_URL,{maxZoom:19,attribution:CONFIG.TILE_ATTR});
      osmLayer.addTo(map);currentBase="osm";
      btn.classList.remove("on");showToast("🗺 Схема");
    }
  });
})();
function showAIExplain(){
  const lines=[];
  lines.push("⚠️ Активных предупреждений: "+[...activeWarnings.values()].filter(w=>!w.dismissed).length);
  for(const w of [...activeWarnings.values()].filter(w=>!w.dismissed)) lines.push("   • "+w.warning.label);
  lines.push("");
  lines.push("💥 Прилётов/падений: "+impactReports.size);
  for(const r of impactReports.values()) lines.push("   • "+r.report.icon+" "+r.name);
  const body=$("aiModalBody");body.textContent=lines.join("\n");
  const timeEl=$("aiModalTime");if(timeEl)timeEl.textContent="Обновлено: "+new Date().toLocaleTimeString("ru-RU");
  $("aiModalBackdrop").classList.add("show");
}
function hideAIExplain(){$("aiModalBackdrop").classList.remove("show");}
(function initAIModal(){
  const backdrop=$("aiModalBackdrop"),closeBtn=$("aiModalClose"),copyBtn=$("aiModalCopy");
  if(!backdrop)return;
  backdrop.addEventListener("click",(e)=>{if(e.target===backdrop)hideAIExplain();});
  if(closeBtn)closeBtn.addEventListener("click",hideAIExplain);
  document.addEventListener("keydown",(e)=>{if(e.key==="Escape"&&backdrop.classList.contains("show"))hideAIExplain();});
  if(copyBtn)copyBtn.addEventListener("click",async()=>{
    try{await navigator.clipboard.writeText($("aiModalBody").textContent||"");copyBtn.textContent="✅";setTimeout(()=>copyBtn.textContent="📋 Копировать",1500);}catch(e){}
  });
})();

document.addEventListener("visibilitychange",()=>{
  if(document.hidden){stopRestPolling();}
  else{if(!wsConnected)startRestPolling();unlockAudio();}
});

(async function init(){
  try{
    loadUavColor();
    wsConnect();
    fetchMessages();
    setInterval(fetchMessages,5000);
    renderWarningsPanel();
    setTimeout(()=>unlockAudio(),500);
  }catch(e){showErr("init: "+(e&&e.message||e));}
})();
</script>
